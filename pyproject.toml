[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "almajhool-ai"
version = "1.0.0"
description = "المبرمج المجهول AI — منصة تدريب نموذج لغوي قابلة للتوسع"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pyyaml>=6.0", "ijson>=3.2", "psutil>=5.9", "fastapi>=0.110",
                "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]

[project.optional-dependencies]
train = ["torch>=2.3", "transformers>=4.51", "peft>=0.13", "accelerate>=0.34",
         "bitsandbytes>=0.43; platform_system == 'Linux'", "safetensors>=0.4", "huggingface_hub>=0.25"]

[project.scripts]
almajhool = "almajhool.cli:main"

[tool.setuptools.packages.find]
include = ["almajhool*", "server*"]

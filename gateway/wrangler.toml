name = "free-ai-gateway"
main = "worker.js"
compatibility_date = "2026-09-01"

# لا تحذف المتغيرات المضافة من لوحة Cloudflare (ACCESS_TOKEN والمفاتيح) عند كل نشر تلقائي من GitHub
keep_vars = true

# الصور + نموذج نصي احتياطي مجاني عبر Workers AI
[ai]
binding = "AI"

# المفاتيح لا تُكتب هنا — أضفها من لوحة Cloudflare أو:  wrangler secret put GROQ_API_KEY
# لتغيير الموديلات عند تبدّلها:
[vars]
# GROQ_MODEL = "openai/gpt-oss-120b"
# CEREBRAS_MODEL = "gpt-oss-120b"
# GEMINI_MODEL = "gemini-2.5-flash"
# OPENROUTER_MODEL = "qwen/qwen3.8-27b:free"
# OPENROUTER_MODELS = "qwen/qwen3.8-27b:free,google/gemma-4-31b-it:free"
# WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

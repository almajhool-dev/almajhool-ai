name: Haider root fix live check

on:
  push:
    branches: ["fix/haider-audio-root"]
    paths:
      - ".github/workflows/haider-root-live.yml"
      - "web/api/_sawtak.js"
      - "web/api/_voice.js"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      SAWTAK_API_KEY: ${{ secrets.SAWTAK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Generate real Haider greeting through production path
        working-directory: web
        run: |
          node --input-type=module <<'NODE'
          import { speak } from "./api/_voice.js";
          const text = "وعليكم السلام، هلا بيك عيني، الحمد لله زين. إنت شلونك شخبارك؟";
          const out = await speak(text, "iraqi");
          console.log("VOICE=" + out.voice);
          console.log("DURATION=" + Number(out.duration || 0).toFixed(3));
          console.log("MP3_BYTES=" + out.audio.length);
          if (out.voice !== "sawtak/haider") throw new Error("wrong voice");
          if (!(out.duration > 3 && out.duration < 15)) throw new Error("bad duration " + out.duration);
          if (!(out.audio.length > 10000 && out.audio.length < 250000)) throw new Error("bad mp3 size " + out.audio.length);
          NODE

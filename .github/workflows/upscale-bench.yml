name: Video upscale benchmark

on:
  push:
    paths: [".github/workflows/upscale-bench.yml", "video/**"]
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Machine
        run: nproc; free -h; ffmpeg -version | head -1 || true
      - name: Test clip (5s, 480p, real footage)
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg mesa-vulkan-drivers vulkan-tools > /dev/null
          curl -fsSL -o src.mp4 "https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/360/Big_Buck_Bunny_360_10s_1MB.mp4" || ffmpeg -v error -f lavfi -i testsrc2=size=640x360:rate=30 -t 5 src.mp4
          ffprobe -v error -show_entries stream=width,height,r_frame_rate,nb_frames -of csv=p=0 src.mp4
          mkdir -p frames && ffmpeg -v error -i src.mp4 -t 3 -q:v 2 frames/%05d.png && ls frames | wc -l
      - name: A) Real-ESRGAN ncnn-vulkan on CPU (lavapipe)
        continue-on-error: true
        run: |
          curl -fsSL -o r.zip https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip && unzip -q r.zip -d resr && chmod +x resr/realesrgan-ncnn-vulkan
          vulkaninfo --summary 2>&1 | grep -i -E "deviceName|driverName" | head
          mkdir -p outA && S=$(date +%s.%N)
          ./resr/realesrgan-ncnn-vulkan -i frames -o outA -n realesr-animevideov3 -s 2 -f png -j 2:4:2 2>&1 | tail -3
          E=$(date +%s.%N); N=$(ls outA | wc -l); echo "A_FRAMES=$N A_SECONDS=$(echo "$E-$S" | bc) PER_FRAME=$(echo "($E-$S)/$N" | bc -l)"
          file outA/00001.png
      - name: B) Real-ESRGAN general-x4v3 PyTorch CPU
        continue-on-error: true
        run: |
          pip -q install torch --index-url https://download.pytorch.org/whl/cpu && pip -q install numpy pillow
          curl -fsSL -o x4v3.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth
          python - <<'PY'
          import torch, torch.nn as nn, glob, time, numpy as np
          from PIL import Image
          class SRVGG(nn.Module):
              def __init__(s, nf=64, nc=32, up=4):
                  super().__init__(); s.up=up; b=[nn.Conv2d(3,nf,3,1,1), nn.PReLU(nf)]
                  for _ in range(nc): b += [nn.Conv2d(nf,nf,3,1,1), nn.PReLU(nf)]
                  b += [nn.Conv2d(nf,3*up*up,3,1,1)]; s.body=nn.ModuleList(b); s.ps=nn.PixelShuffle(up)
              def forward(s,x):
                  o=x
                  for l in s.body: o=l(o)
                  return s.ps(o)+nn.functional.interpolate(x,scale_factor=s.up,mode='nearest')
          m=SRVGG(); sd=torch.load('x4v3.pth',map_location='cpu'); sd=sd.get('params',sd); m.load_state_dict(sd); m.eval()
          torch.set_num_threads(4)
          fs=sorted(glob.glob('frames/*.png'))[:20]; t=time.time()
          with torch.no_grad():
              for f in fs:
                  x=torch.from_numpy(np.asarray(Image.open(f).convert('RGB'))).permute(2,0,1).float().div(255)[None]
                  y=m(x).clamp(0,1)
          dt=time.time()-t; print('B_FRAMES',len(fs),'B_SECONDS',round(dt,1),'PER_FRAME',round(dt/len(fs),2),'OUT',tuple(y.shape))
          PY
      - name: C) ffmpeg lanczos x2 + denoise + sharpen
        run: |
          S=$(date +%s.%N); ffmpeg -v error -y -i src.mp4 -t 3 -vf "hqdn3d=1.5:1.5:6:6,scale=iw*2:ih*2:flags=lanczos,unsharp=5:5:0.8:3:3:0.4" -c:v libx264 -crf 17 -preset medium outC.mp4; E=$(date +%s.%N)
          echo "C_SECONDS=$(echo "$E-$S" | bc)"; ffprobe -v error -show_entries stream=width,height -of csv=p=0 outC.mp4

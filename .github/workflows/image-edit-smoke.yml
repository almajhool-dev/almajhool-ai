name: Image edit smoke test

# صورة محادثة + صورة حقيقية: البوت يفهم الطلب، يمسح/يبدّل/يكتب بدقة، ويفحص النتيجة قبل ما يدزها
on:
  push:
    paths: ["web/api/_imageedit.js", ".github/smoke/image_edit.mjs", ".github/workflows/image-edit-smoke.yml"]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DATABASE_URL: postgres://unused:unused@localhost/unused
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: curl -fsSL -A "Mozilla/5.0" -o web/cat.jpg "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Cat03.jpg/500px-Cat03.jpg"
      - name: Understand, edit precisely, verify
        run: cp .github/smoke/image_edit.mjs web/ && cd web && node image_edit.mjs
      - name: Show the results (branches other than main)
        if: always() && github.ref != 'refs/heads/main'
        run: |
          [ -d out ] || exit 0
          cd out && git init -q && git checkout -qb ci-image-preview
          git config user.name preview && git config user.email preview@users.noreply.github.com && git add . && git commit -qm preview
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-image-preview

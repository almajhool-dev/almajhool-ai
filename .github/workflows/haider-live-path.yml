name: Haider live voice path

on:
  push:
    branches: ["fix/voice-reply-always"]
    paths:
      - ".github/workflows/haider-live-path.yml"
      - "web/api/_sawtak.js"
      - "web/api/_voice.js"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      SAWTAK_API_KEY: ${{ secrets.SAWTAK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Generate with the exact Telegram voice path
        working-directory: web
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { speak } from "./api/_voice.js";
          const text = "هلو عيني، شلونك اليوم؟ آني حاضر وياك وكلشي تمام. إذا تريد أي شي گلي وأنا أساعدك هسه. ما راح أطول عليك بالحچي، ونخلي الكلام واضح وبسيط. وإذا عندك سؤال ثاني دزه إليّ وأنا أرد عليك بصوت واضح.";
          const out = await speak(text, "iraqi");
          if (out.voice !== "sawtak/haider") throw new Error("wrong voice: " + out.voice);
          if (!out.audio || out.audio.length < 1000) throw new Error("audio too small");
          fs.writeFileSync("/tmp/haider.mp3", out.audio);
          console.log("VOICE=" + out.voice);
          console.log("BYTES=" + out.audio.length);
          NODE
          file /tmp/haider.mp3

name: Deploy (Cloudflare gateway + Vercel site)

# ينشر البوابة والموقع تلقائيًا عند كل دمج في main — بدون ربط Git من لوحات Cloudflare/Vercel.
# يحتاج أسرار المستودع (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  (قالب "Edit Cloudflare Workers")   CLOUDFLARE_ACCOUNT_ID
#   VERCEL_TOKEN          (vercel.com/account/tokens)
# ومفاتيح نماذج الذكاء (GROQ_API_KEY، GEMINI_API_KEY، …) تُضاف بنفس الصفحة وتنتقل للبوابة تلقائيًا.
# أي سر ناقص: الخطوة الخاصة به تُتخطى برسالة واضحة.

on:
  push:
    branches: [main]
    paths: ["gateway/**", "web/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  gateway:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID missing — skipping gateway deploy"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with: { node-version: 22 }
      - name: wrangler deploy
        if: steps.check.outputs.ok == 'true'
        working-directory: gateway
        run: npx --yes wrangler@4 deploy
      # مفاتيح المزودين: تضيفها مرة وحدة في أسرار GitHub، وهنا تنتقل للبوابة تلقائيًا
      - name: Sync AI provider keys to the gateway
        if: steps.check.outputs.ok == 'true'
        working-directory: gateway
        # كل مفتاح باسمه (GitHub يوقف أي workflow يمرر كل الأسرار دفعة وحدة)
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          HYPERBOLIC_API_KEY: ${{ secrets.HYPERBOLIC_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          OVH_API_KEY: ${{ secrets.OVH_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          EXTRA_PROVIDERS: ${{ secrets.EXTRA_PROVIDERS }}
        run: |
          echo '{}' > "$RUNNER_TEMP/keys.json"
          for K in CEREBRAS_API_KEY GROQ_API_KEY GEMINI_API_KEY NVIDIA_API_KEY MISTRAL_API_KEY ZAI_API_KEY OPENROUTER_API_KEY GITHUB_MODELS_TOKEN SAMBANOVA_API_KEY COHERE_API_KEY HF_TOKEN SCALEWAY_API_KEY AI_GATEWAY_API_KEY NEBIUS_API_KEY HYPERBOLIC_API_KEY TOGETHER_API_KEY KILO_API_KEY LLM7_API_KEY OVH_API_KEY POLLINATIONS_API_KEY EXTRA_PROVIDERS; do
            V="${!K}"
            if [ -n "$V" ]; then
              jq --arg k "$K" --arg v "$V" '. + {($k): $v}' "$RUNNER_TEMP/keys.json" > "$RUNNER_TEMP/k.tmp" && mv "$RUNNER_TEMP/k.tmp" "$RUNNER_TEMP/keys.json"
            fi
          done
          echo "Keys found in GitHub secrets: $(jq -r 'keys | join(", ")' "$RUNNER_TEMP/keys.json")"
          if [ "$(jq 'length' "$RUNNER_TEMP/keys.json")" -gt 0 ]; then
            npx --yes wrangler@4 secret bulk "$RUNNER_TEMP/keys.json"
          else echo "No provider keys yet — gateway keeps using its keyless sources"; fi
          rm -f "$RUNNER_TEMP/keys.json"

  site:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # مفاتيح النماذج المتصلة مباشرة بالموقع (اختيارية) — تُمرر لـ Vercel عند النشر
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_MODELS: ${{ secrets.GEMINI_MODELS }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      BEST_OF: ${{ secrets.BEST_OF }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      SAWTAK_API_KEY: ${{ secrets.SAWTAK_API_KEY }}
      # ChatGPT المجاني (أي مفتاح منهم يكفي)
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # أي مفتاح من هذول تضيفه بأسرار GitHub يشارك تلقائيًا بـ«كل النماذج مرة وحدة»
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
      LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
      OVH_API_KEY: ${{ secrets.OVH_API_KEY }}
      EXTRA_PROVIDERS: ${{ secrets.EXTRA_PROVIDERS }}
      # رفع دقة المقاطع يبدي فورًا بدل انتظار الجدولة (اختياري)
      GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
      VERCEL_ORG_ID: team_NBBbzX5kmVSyPFgEVJL6FHUZ
      VERCEL_PROJECT_ID: prj_hBLuwRudiTRyj4cCilx8CdvbmmaX
    steps:
      - uses: actions/checkout@v4
      - name: Check secret
        id: check
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN missing — skipping site deploy"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - name: Check the video wake-up key (GH_DISPATCH_TOKEN)
        run: |
          if [ -z "$GH_DISPATCH_TOKEN" ]; then echo "::warning::GH_DISPATCH_TOKEN missing — videos wait for a manual start"; exit 0; fi
          CODE=$(curl -s -o /tmp/d.json -w "%{http_code}" -X POST -H "Authorization: Bearer $GH_DISPATCH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches" -d '{"event_type":"token-check"}')
          if [ "$CODE" = "204" ]; then echo "GH_DISPATCH_TOKEN works: videos start instantly"
          else echo "::warning::GH_DISPATCH_TOKEN does not work (HTTP $CODE): $(cat /tmp/d.json)"; fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with: { node-version: 22 }
      - name: Smoke test free image sources (real network)
        if: steps.check.outputs.ok == 'true'
        continue-on-error: true
        run: |
          node --input-type=module -e "
            import { fallbackImage } from './web/api/_images.js';
            const t = Date.now();
            try { const r = await fallbackImage('a red apple on a wooden table, photo', 'skip-gateway');
                  console.log('IMAGE_OK', r.provider, r.image.length, 'chars', (Date.now() - t) + 'ms'); }
            catch (e) { console.log('IMAGE_FAIL', e.message); process.exitCode = 1; }"
      - name: Smoke test Gemini (real network)
        if: steps.check.outputs.ok == 'true' && env.GEMINI_API_KEY != ''
        continue-on-error: true
        run: |
          node --input-type=module -e "
            import { directText } from './web/api/_direct.js';
            try { const t = await directText([{ role: 'user', content: 'رد بكلمة وحدة: شنو عاصمة العراق؟' }], { max_tokens: 50 });
                  console.log('GEMINI_OK', t.trim().slice(0, 60)); }
            catch (e) { console.log('GEMINI_FAIL', e.message.slice(0, 300)); process.exitCode = 1; }"
      - name: vercel deploy --prod
        if: steps.check.outputs.ok == 'true'
        run: |
          # إذا كان Root Directory للمشروع = web ننشر من جذر المستودع، وإلا ننشر من داخل web/
          ROOT=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" | jq -r '.rootDirectory // ""')
          echo "Vercel project rootDirectory: '${ROOT}'"
          if [ "$ROOT" = "web" ]; then DIR=.; else DIR=web; fi
          cd "$DIR"
          ENVS=()
          for K in GEMINI_API_KEY GEMINI_API_KEY_2 GEMINI_API_KEY_3 GEMINI_API_KEY_4 GEMINI_MODELS HF_TOKEN BEST_OF TELEGRAM_BOT_TOKEN SAWTAK_API_KEY POLLINATIONS_API_KEY GROQ_API_KEY OPENROUTER_API_KEY CEREBRAS_API_KEY NVIDIA_API_KEY MISTRAL_API_KEY ZAI_API_KEY SAMBANOVA_API_KEY COHERE_API_KEY AI_GATEWAY_API_KEY KILO_API_KEY LLM7_API_KEY OVH_API_KEY GH_DISPATCH_TOKEN; do
            if [ -n "${!K}" ]; then ENVS+=(-e "$K=${!K}"); echo "passing $K to the site"; fi
          done
          if [ -n "$EXTRA_PROVIDERS" ]; then ENVS+=(-e "EXTRA_PROVIDERS=$EXTRA_PROVIDERS"); echo "passing EXTRA_PROVIDERS to the site"; fi
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" "${ENVS[@]}"
      # بوت تلكرام: إذا السر TELEGRAM_BOT_TOKEN موجود نربط البوت بالموقع ونضبط اسمه وأوامره تلقائيًا
      - name: Connect Telegram bot
        if: steps.check.outputs.ok == 'true' && env.TELEGRAM_BOT_TOKEN != ''
        run: |
          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          SECRET=$(printf '%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-48)
          curl -fsS "$API/setWebhook" -H 'Content-Type: application/json' \
            -d "{\"url\":\"https://almajhool-ai.vercel.app/api/telegram\",\"secret_token\":\"$SECRET\",\"allowed_updates\":[\"message\"],\"drop_pending_updates\":false}" | jq -c '{ok, description}'
          curl -fsS "$API/setMyCommands" -H 'Content-Type: application/json' \
            -d '{"commands":[{"command":"start","description":"شلون أستخدم البوت"},{"command":"new","description":"ابدأ من جديد (موقع ومحادثة جديدة)"},{"command":"help","description":"أمثلة على الطلبات"}]}' | jq -c '{ok}'
          curl -fsS "$API/setMyDescription" -H 'Content-Type: application/json' \
            -d '{"description":"البوت الرسمي لـ «المبرمج المجهول AI»: اسأل أي سؤال، ارسم صور بكتابة عربية صحيحة، وابني وانشر مواقع — كله بالعربي ومجانًا."}' | jq -c '{ok}'
          curl -fsS "$API/getMe" | jq -r '"Bot: @" + .result.username'
          curl -fsS "$API/getWebhookInfo" | jq -c '.result | {url, pending_update_count, last_error_message}'

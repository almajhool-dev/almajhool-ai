name: Deploy (Cloudflare gateway + Vercel site)

# ينشر البوابة والموقع تلقائيًا عند كل دمج في main — بدون ربط Git من لوحات Cloudflare/Vercel.
# يحتاج أسرار المستودع (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  (قالب "Edit Cloudflare Workers")   CLOUDFLARE_ACCOUNT_ID
#   VERCEL_TOKEN          (vercel.com/account/tokens)
# ومفاتيح نماذج الذكاء (GROQ_API_KEY، GEMINI_API_KEY، …) تُضاف بنفس الصفحة وتنتقل للبوابة تلقائيًا.
# أي سر ناقص: الخطوة الخاصة به تُتخطى برسالة واضحة.

on:
  push:
    branches: [main]
    paths: ["gateway/**", "web/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  gateway:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID missing — skipping gateway deploy"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with: { node-version: 22 }
      - name: wrangler deploy
        if: steps.check.outputs.ok == 'true'
        working-directory: gateway
        run: npx --yes wrangler@4 deploy
      # مفاتيح المزودين: تضيفها مرة وحدة في أسرار GitHub، وهنا تنتقل للبوابة تلقائيًا
      - name: Sync AI provider keys to the gateway
        if: steps.check.outputs.ok == 'true'
        working-directory: gateway
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          NAMES="CEREBRAS_API_KEY GROQ_API_KEY GEMINI_API_KEY NVIDIA_API_KEY MISTRAL_API_KEY ZAI_API_KEY OPENROUTER_API_KEY
                 GITHUB_MODELS_TOKEN SAMBANOVA_API_KEY COHERE_API_KEY HF_TOKEN SCALEWAY_API_KEY AI_GATEWAY_API_KEY
                 NEBIUS_API_KEY HYPERBOLIC_API_KEY TOGETHER_API_KEY KILO_API_KEY LLM7_API_KEY OVH_API_KEY POLLINATIONS_API_KEY
                 EXTRA_PROVIDERS"
          FILTER=$(printf '%s\n' $NAMES | jq -R . | jq -s .)
          echo "$ALL_SECRETS" | jq --argjson n "$FILTER" 'with_entries(select(.key as $k | $n | index($k)) | select(.value != ""))' > "$RUNNER_TEMP/keys.json"
          echo "Keys found in GitHub secrets: $(jq -r 'keys | join(", ")' "$RUNNER_TEMP/keys.json")"
          if [ "$(jq 'length' "$RUNNER_TEMP/keys.json")" -gt 0 ]; then
            npx --yes wrangler@4 secret bulk "$RUNNER_TEMP/keys.json"
          else echo "No provider keys yet — gateway keeps using its keyless sources"; fi
          rm -f "$RUNNER_TEMP/keys.json"

  site:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_NBBbzX5kmVSyPFgEVJL6FHUZ
      VERCEL_PROJECT_ID: prj_hBLuwRudiTRyj4cCilx8CdvbmmaX
    steps:
      - uses: actions/checkout@v4
      - name: Check secret
        id: check
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN missing — skipping site deploy"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with: { node-version: 22 }
      - name: Smoke test free image sources (real network)
        if: steps.check.outputs.ok == 'true'
        continue-on-error: true
        run: |
          node --input-type=module -e "
            import { fallbackImage } from './web/api/_images.js';
            const t = Date.now();
            try { const r = await fallbackImage('a red apple on a wooden table, photo', 'skip-gateway');
                  console.log('IMAGE_OK', r.provider, r.image.length, 'chars', (Date.now() - t) + 'ms'); }
            catch (e) { console.log('IMAGE_FAIL', e.message); process.exitCode = 1; }"
      - name: vercel deploy --prod
        if: steps.check.outputs.ok == 'true'
        run: |
          # إذا كان Root Directory للمشروع = web ننشر من جذر المستودع، وإلا ننشر من داخل web/
          ROOT=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" | jq -r '.rootDirectory // ""')
          echo "Vercel project rootDirectory: '${ROOT}'"
          if [ "$ROOT" = "web" ]; then DIR=.; else DIR=web; fi
          cd "$DIR"
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

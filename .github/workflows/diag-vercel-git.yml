name: Diagnose Vercel git deploy status

on:
  push:
    branches: ["diag/vercel-git-deploy-status"]
    paths: [".github/workflows/diag-vercel-git.yml"]

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_NBBbzX5kmVSyPFgEVJL6FHUZ
      VERCEL_PROJECT_ID: prj_hBLuwRudiTRyj4cCilx8CdvbmmaX
      PREVIEW_ID: dpl_C8dvjAETQr7CBVKdreNanpzESLe6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect preview deployment environment metadata
        shell: bash
        run: |
          curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN"             "https://api.vercel.com/v13/deployments/$PREVIEW_ID?teamId=$VERCEL_ORG_ID"             | jq -c '{
                id,url,readyState,target,source,
                meta:{sha:.meta.githubCommitSha,ref:.meta.githubCommitRef},
                envKeys:((.env // {})|keys),
                buildEnvKeys:((.build.env // .buildEnv // {})|keys)
              }'

name: Diagnose Vercel git deploy status

on:
  push:
    branches: ["diag/vercel-git-deploy-status"]
    paths: [".github/workflows/diag-vercel-git.yml"]

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_NBBbzX5kmVSyPFgEVJL6FHUZ
      PREVIEW_ID: dpl_C8dvjAETQr7CBVKdreNanpzESLe6
    steps:
      - uses: actions/checkout@v4
      - name: Check required env names on preview
        shell: bash
        run: |
          J=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN"             "https://api.vercel.com/v13/deployments/$PREVIEW_ID?teamId=$VERCEL_ORG_ID")
          echo "$J" | jq -c '
            def envname:
              if type=="string" then split("=")[0]
              elif type=="object" then (.key // .name // "")
              else "" end;
            [(.env // [])[]? | envname] as $names
            | {
                id,url,readyState,
                hasSawtak:($names | index("SAWTAK_API_KEY") != null),
                hasTelegram:($names | index("TELEGRAM_BOT_TOKEN") != null),
                hasGemini:($names | index("GEMINI_API_KEY") != null),
                selectedEnvNames:[$names[] | select(.=="SAWTAK_API_KEY" or .=="TELEGRAM_BOT_TOKEN" or .=="GEMINI_API_KEY" or .=="OPENROUTER_API_KEY" or .=="MISTRAL_API_KEY")]
              }'

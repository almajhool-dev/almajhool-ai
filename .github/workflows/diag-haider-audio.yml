name: Diagnose Haider audio integrity

on:
  push:
    branches: ["diag/haider-audio-integrity"]
    paths: [".github/workflows/diag-haider-audio.yml"]

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SAWTAK_API_KEY: ${{ secrets.SAWTAK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Compare Sawtak synthesis variants
        working-directory: web
        run: |
          node --input-type=module <<'NODE'
          const key = process.env.SAWTAK_API_KEY;
          const voice = "380ef7b6-ffea-52fd-89bd-d661a9b01bcc";
          const BASE = "https://api.sawtakarabi.ai/v1/audio/speech";
          const variants = [
            { name: "plain_enhanced", input: "وعليكم السلام هلا بيك عيني الحمد لله زين انت شلونك شخبارك", enhance_pronunciation: true },
            { name: "plain_no_enhance", input: "وعليكم السلام هلا بيك عيني الحمد لله زين انت شلونك شخبارك", enhance_pronunciation: false }
          ];
          function stats(bytes, rate) {
            const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
            const n = Math.floor(bytes.byteLength/2);
            let peak=0, first=-1, last=-1;
            for (let i=0;i<n;i++) {
              const a=Math.abs(view.getInt16(i*2,true));
              peak=Math.max(peak,a);
              if (a>=20) { if(first<0) first=i; last=i; }
            }
            return {
              total:(n/rate).toFixed(3),
              active:first<0?"none":(first/rate).toFixed(3)+".."+(last/rate).toFixed(3),
              activeSeconds:first<0?0:((last-first+1)/rate).toFixed(3),
              peak
            };
          }
          const results = await Promise.all(variants.map(async v => {
            const r = await fetch(BASE,{
              method:"POST",
              headers:{Authorization:"Bearer "+key,"Content-Type":"application/json"},
              body:JSON.stringify({
                model:"arabic-tts-1",voice,input:v.input,response_format:"pcm",sample_rate:24000,
                normalize_text:true,enhance_pronunciation:v.enhance_pronunciation,temperature:0.35
              }),
              signal:AbortSignal.timeout(90000)
            });
            if(!r.ok) return {name:v.name,status:r.status,error:(await r.text()).slice(0,300)};
            const rate=Number(r.headers.get("x-sample-rate")||24000);
            const bytes=new Uint8Array(await r.arrayBuffer());
            return {name:v.name,status:r.status,bytes:bytes.byteLength,rate,...stats(bytes,rate)};
          }));
          console.log(JSON.stringify(results,null,2));
          NODE

name: Dispatch token check  # recheck
on:
  push:
    branches-ignore: [main]
    paths: [".github/workflows/dispatch-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          echo "token length: ${#T}  prefix: ${T:0:11}"
          curl -s -o /dev/null -w "repo GET: %{http_code}\n" -H "Authorization: Bearer $T" https://api.github.com/repos/${{ github.repository }}
          curl -s -w "\ndispatch POST: %{http_code}\n" -X POST -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches -d '{"event_type":"token-check"}'

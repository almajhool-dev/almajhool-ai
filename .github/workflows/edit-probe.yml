name: Image enhance probe (temporary)
on:
  push:
    branches-ignore: [main]
    paths: [".github/probe/**", ".github/workflows/edit-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DATABASE_URL: postgres://unused:unused@localhost/unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: curl -fsSL -A "Mozilla/5.0" -o web/face.jpg "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b6/Gilbert_Stuart_Williamstown_Portrait_of_George_Washington.jpg/500px-Gilbert_Stuart_Williamstown_Portrait_of_George_Washington.jpg"
      - run: cp .github/probe/enhance.mjs web/ && cd web && node enhance.mjs
      - name: Publish results for a look
        if: always()
        run: |
          [ -d probe_out ] || exit 0
          cd probe_out && git init -q && git checkout -qb ci-probe-edit
          git config user.name preview && git config user.email preview@users.noreply.github.com && git add . && git commit -qm preview
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-probe-edit

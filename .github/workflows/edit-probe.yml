name: Export upscaler (temporary)
on:
  push:
    branches-ignore: [main]
    paths: [".github/probe/**", ".github/workflows/edit-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip -q install torch --index-url https://download.pytorch.org/whl/cpu && pip -q install numpy onnx onnxruntime
      - run: mkdir -p probe_out && python .github/probe/export_onnx.py
      - name: Publish
        run: |
          cd probe_out && git init -q && git checkout -qb ci-probe-edit
          git config user.name preview && git config user.email preview@users.noreply.github.com && git add . && git commit -qm onnx
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-probe-edit

name: Image edit probe (temporary)
on:
  push:
    branches-ignore: [main]
    paths: [".github/probe/**", ".github/workflows/edit-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DATABASE_URL: postgres://unused:unused@localhost/unused
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: cp .github/probe/edit_spaces.mjs web/ && cd web && node edit_spaces.mjs
      - name: Publish results for a look
        run: |
          mkdir -p /tmp/pv && cp probe_out/* /tmp/pv/ && cd /tmp/pv && git init -q && git checkout -qb ci-probe-edit
          git config user.name preview && git config user.email preview@users.noreply.github.com && git add . && git commit -qm preview
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-probe-edit

name: Image edit probe (temporary)
on:
  push:
    branches-ignore: [main]
    paths: [".github/probe/**", ".github/workflows/edit-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: python .github/probe/edit_probe.py
      - name: Publish the results for a look (temporary branch)
        run: |
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git checkout --orphan ci-probe-edit && git rm -rfq . && cp probe_out/* . && git add *.jpg && git commit -qm probe && git push -fq origin ci-probe-edit

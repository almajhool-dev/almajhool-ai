name: Image sources smoke test

# يجرّب مصادر الصور المجانية من شبكة حقيقية (خوادم GitHub) عند كل تعديل عليها — بدون نشر
on:
  push:
    paths: ["web/api/_images.js", "web/api/_direct.js", ".github/workflows/image-smoke.yml"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Generate one real image via the free fallback chain
        run: |
          node --input-type=module -e "
            import { fallbackImage } from './web/api/_images.js';
            const t = Date.now();
            try { const r = await fallbackImage('a red apple on a wooden table, photo', 'skip-gateway');
                  console.log('IMAGE_OK', r.provider, r.image.length, 'chars', (Date.now() - t) + 'ms'); }
            catch (e) { console.log('IMAGE_FAIL', e.message); process.exitCode = 1; }"
      - name: Arabic request is understood (translated to English)
        run: |
          node --input-type=module -e "
            import { toEnglishPrompt, hasArabic, translateErrors } from './web/api/_images.js';
            for (const q of ['صمم صور الامن السيبراني', 'ارسملي قطة لابسة نظارات بستايل انمي', 'سيارة لامبورغيني بالليل تحت المطر']) {
              const en = await toEnglishPrompt(q);
              console.log(hasArabic(en) ? 'AR_FAIL' : 'AR_OK', q, '=>', en, translateErrors.length ? 'errors=' + translateErrors.join(' | ') : '');
              if (hasArabic(en)) process.exitCode = 1;
            }"
      - name: Gemini answers (real key, real network)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY not set — skipping"; exit 0; fi
          node --input-type=module -e "
            import { directText } from './web/api/_direct.js';
            import { toEnglishPrompt } from './web/api/_images.js';
            try {
              const a = await directText([{ role: 'user', content: 'رد بكلمة وحدة: شنو عاصمة العراق؟' }], { max_tokens: 50 });
              console.log('GEMINI_OK', a.trim().slice(0, 80));
              const en = await toEnglishPrompt('صمملي شعار لقناة يوتيوب عن الأمن السيبراني', (m) => directText(m, { max_tokens: 300 }));
              console.log('GEMINI_PROMPT', en.slice(0, 200));
            } catch (e) { console.log('GEMINI_FAIL', e.message.slice(0, 400)); process.exitCode = 1; }"
      - name: Gemini draws the image itself (real key)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY not set — skipping"; exit 0; fi
          node --input-type=module -e "
            import { geminiImage } from './web/api/_images.js';
            const t = Date.now();
            try { const r = await geminiImage('ارسملي أسد لابس تاج ذهبي بستايل واقعي، وجنبه مكتوب \"المجهول\"');
                  console.log('GEMINI_IMAGE_OK', r.model, r.image.length, 'chars', (Date.now() - t) + 'ms'); }
            catch (e) { console.log('GEMINI_IMAGE_FAIL', e.message.slice(0, 600)); }"
      - name: Full path — Gemini prompt + best-of-3 + Gemini judge (real key)
        continue-on-error: true  # حصة ZeroGPU لخادم الاختبار نفسه قد تنتهي
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY not set — skipping"; exit 0; fi
          node --input-type=module -e "
            import { toEnglishPrompt, bestImage } from './web/api/_images.js';
            import { directText } from './web/api/_direct.js';
            const req = 'ارسملي أسد لابس تاج ذهبي، بستايل واقعي، خلفية صحراء وقت الغروب';
            const t0 = Date.now();
            const en = await toEnglishPrompt(req, (m) => directText(m, { max_tokens: 600, temperature: 0.5 }));
            console.log('PROMPT', ((Date.now() - t0) / 1000).toFixed(1) + 's', en);
            const t1 = Date.now();
            const r = await bestImage(en, req, (m) => directText(m, { max_tokens: 50 }));
            console.log('BEST_OK', r.provider, 'candidates=' + r.candidates, 'judged=' + !!r.judged, ((Date.now() - t1) / 1000).toFixed(1) + 's', r.image.length, 'chars', 'errors=' + JSON.stringify(r.errors || []));"
      - name: Gemini keeps requested Arabic text and describes the flag (real key)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY not set — skipping"; exit 0; fi
          node --input-type=module -e "
            import { toEnglishPrompt } from './web/api/_images.js';
            import { directText } from './web/api/_direct.js';
            const req = 'صمم صوره شخص لابس زي الحشد الشعبي ومكتوب في بدلته الحشد الشعبي بل عربي وعلم الحشد الشعبي';
            const en = await toEnglishPrompt(req, (m) => directText(m, { max_tokens: 600, temperature: 0.5 }));
            console.log('PMF_PROMPT', en);
            if (/He designed|rather Arabic/.test(en)) { console.log('FELL BACK TO GOOGLE TRANSLATE'); process.exitCode = 1; }"

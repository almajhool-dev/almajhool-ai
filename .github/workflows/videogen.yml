name: AI video generation (Telegram bot)

# «سويلي فيديو…» بالبوت: البوت يجهز الوصف ويبعثه هنا، ونماذج الفيديو المجانية تسوي المقطع ويوصل للمستخدم بتلكرام
on:
  repository_dispatch:
    types: [videogen]
  workflow_dispatch:
    inputs:
      prompt: { description: "English prompt (test)", required: false }

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://unused:unused@localhost/unused
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      JOB: ${{ toJSON(github.event.client_payload) }}
      TEST_PROMPT: ${{ github.event.inputs.prompt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Make the video and send it
        run: cp video/videogen.mjs web/ && cd web && node videogen.mjs
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with: { name: generated, path: web/generated.mp4, retention-days: 2, if-no-files-found: ignore }

name: Tests

on:
  push:
    paths: ["almajhool/**", "server/**", "tests/**", "requirements.txt"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pyyaml ijson psutil fastapi uvicorn python-multipart httpx pytest
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pytest -q tests

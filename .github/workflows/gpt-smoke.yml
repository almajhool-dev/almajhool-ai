name: ChatGPT smoke test

# يجرّب ChatGPT المجاني من شبكة حقيقية: نماذج OpenAI عبر GitHub Models + Pollinations بدون مفتاح
on:
  push:
    paths: ["web/api/_direct.js", ".github/workflows/gpt-smoke.yml"]
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  gpt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Debug GitHub Models endpoint
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GH_MODELS_TOKEN || github.token }}
        run: |
          for U in https://models.github.ai/inference/chat/completions https://models.inference.ai.azure.com/chat/completions; do
            echo "== $U"
            curl -sS -i -X POST "$U" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -H "Accept: application/json" \
              -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"say hi"}],"max_tokens":20}' | head -c 1200; echo
          done
          curl -sS "https://models.github.ai/catalog/models" -H "Authorization: Bearer $TOKEN" | jq -r '.[].id' 2>/dev/null | grep -i openai | head -20
      - name: ChatGPT via GitHub Models (OpenAI gpt-4.1 / gpt-4o)
        continue-on-error: true
        env:
          # مفتاح المستودع المؤقت (للتجربة فقط) — بالموقع نستخدم مفتاح GitHub دائم بصلاحية Models
          GITHUB_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN || github.token }}
        run: |
          node --input-type=module -e "
            import { directChat } from './web/api/_direct.js';
            const s = Date.now();
            try {
              const { res, model } = await directChat({ provider: 'chatgpt', stream: false, max_tokens: 200, messages: [{ role: 'user', content: 'جاوب باللهجة العراقية بجملة وحدة: شنو أحسن أكلة عراقية؟' }] });
              const j = await res.json(); console.log('GH_GPT_OK', model, (Date.now() - s) + 'ms', '|', j.choices[0].message.content);
            } catch (e) { console.log('GH_GPT_FAIL', e.message.slice(0, 500)); process.exitCode = 1; }"
      - name: Pollinations endpoints (raw)
        continue-on-error: true
        run: |
          for U in https://text.pollinations.ai/openai https://gen.pollinations.ai/v1/chat/completions https://text.pollinations.ai/v1/chat/completions; do
            echo "== $U"
            curl -sS -i -m 60 -X POST "$U" -H "Content-Type: application/json" \
              -d '{"model":"openai","messages":[{"role":"user","content":"say hi in Iraqi Arabic"}],"max_tokens":40}' | head -c 900; echo
          done
          curl -sS -m 30 https://text.pollinations.ai/models | jq -c '[.[] | {name, description, tier}] | .[:15]' 2>/dev/null | head -c 1500
      - name: ChatGPT without any key (Pollinations)
        continue-on-error: true
        run: |
          node --input-type=module -e "
            import { directChat } from './web/api/_direct.js';
            const s = Date.now();
            try {
              const { res, model } = await directChat({ provider: 'chatgpt-free', stream: false, max_tokens: 200, messages: [{ role: 'user', content: 'جاوب باللهجة العراقية بجملة وحدة: شنو أحسن أكلة عراقية؟' }] });
              const j = await res.json(); console.log('FREE_GPT_OK', model, (Date.now() - s) + 'ms', '|', j.choices[0].message.content);
            } catch (e) { console.log('FREE_GPT_FAIL', e.message.slice(0, 500)); process.exitCode = 1; }"
      - name: Streaming works (site chat uses SSE)
        continue-on-error: true
        env:
          GITHUB_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN || github.token }}
        run: |
          node --input-type=module -e "
            import { directChat } from './web/api/_direct.js';
            const { res, provider, model } = await directChat({ provider: ['chatgpt', 'chatgpt-free'], max_tokens: 60, messages: [{ role: 'user', content: 'قل مرحبا' }] });
            const t = await res.text(); console.log('STREAM', provider, model, res.headers.get('content-type'), t.split('\n').filter((l) => l.startsWith('data:')).length, 'events');"

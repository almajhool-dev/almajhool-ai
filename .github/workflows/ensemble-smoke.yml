name: All models together smoke test

# يجرّب «كل النماذج مرة وحدة» من شبكة حقيقية: كل مصدر يجاوب، وبعدها جواب واحد نهائي
on:
  push:
    paths: ["web/api/_ensemble.js", "web/api/_search.js", "web/api/telegram.js", ".github/workflows/ensemble-smoke.yml"]
  workflow_dispatch:

jobs:
  ensemble:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://unused:unused@localhost/unused
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      EXTRA_PROVIDERS: ${{ secrets.EXTRA_PROVIDERS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Each free provider answers an Iraqi question (its own key)
        continue-on-error: true
        working-directory: web
        run: |
          node --input-type=module -e "
            import { DIRECT } from './api/_direct.js';
            for (const p of DIRECT) {
              const key = process.env[p.key];
              if (!key && !p.keyless) { console.log('PROVIDER', p.id, 'no key'); continue; }
              const s = Date.now();
              try {
                const r = await fetch(p.url, { method: 'POST', signal: AbortSignal.timeout(40000),
                  headers: { 'Content-Type': 'application/json', ...(key ? { Authorization: 'Bearer ' + String(key).split(/[\\s,]+/)[0] } : {}), ...(p.headers || {}) },
                  body: JSON.stringify({ model: p.models[0], max_tokens: 200, messages: [{ role: 'user', content: 'جاوب بالعراقي بجملة وحدة: شنو أشهر أكلة ببغداد؟' }] }) });
                const j = await r.json().catch(() => ({}));
                console.log('PROVIDER', p.id, r.status, (Date.now() - s) + 'ms', r.ok ? (j.choices?.[0]?.message?.content || '').slice(0, 120).replace(/\\n/g, ' ') : JSON.stringify(j).slice(0, 160));
              } catch (e) { console.log('PROVIDER', p.id, 'error', e.message); }
            }"
      - name: Mistral details (limits per model)
        continue-on-error: true
        run: |
          [ -n "$MISTRAL_API_KEY" ] || exit 0
          echo "models: $(curl -sS -H "Authorization: Bearer $MISTRAL_API_KEY" https://api.mistral.ai/v1/models | jq -r '[.data[]?.id] | length') available"
          for M in mistral-large-latest magistral-medium-latest magistral-small-latest pixtral-large-latest mistral-saba-latest ministral-14b-latest ministral-3b-latest open-mistral-nemo devstral-medium-latest; do
            curl -sS -D /tmp/h -o /tmp/b -H "Authorization: Bearer $MISTRAL_API_KEY" -H "Content-Type: application/json" \
              https://api.mistral.ai/v1/chat/completions -d "{\"model\":\"$M\",\"max_tokens\":30,\"messages\":[{\"role\":\"user\",\"content\":\"جاوب باللهجة العراقية بجملة وحدة: شلونك؟\"}]}"
            echo "MISTRAL $M $(head -1 /tmp/h | tr -d '\r') | $(grep -i ratelimit /tmp/h | tr -d '\r' | tr '\n' ' ') | $(jq -c '.choices[0].message.content // .message // .' /tmp/b | head -c 200)"
            sleep 2
          done
      - name: Quick reply speed (voice notes and small talk)
        continue-on-error: true
        working-directory: web
        run: |
          node --input-type=module -e "
            import { DIRECT, directText } from './api/_direct.js';
            import { speak } from './api/_voice.js';
            const lite = DIRECT.find((p) => p.id === 'gemini')?.lite;
            for (const q of ['هلو شلونك حبيبي', 'شنو أحسن أكلة عراقية؟', 'اكتبلي بيت شعر عن بغداد']) {
              const s = Date.now();
              try {
                const a = await directText([{ role: 'system', content: 'رد باللهجة العراقية بكلام محكي قصير.' }, { role: 'user', content: q }], { max_tokens: 600, timeout: 15000, prefer: lite });
                const t = Date.now(); const v = await speak(a, 'iraqi');
                console.log('QUICK', (t - s) + 'ms text +', (Date.now() - t) + 'ms voice (' + v.voice + ') |', q, '=>', a.replace(/\s+/g, ' ').slice(0, 120));
              } catch (e) { console.log('QUICK_FAIL', q, e.message.slice(0, 200)); }
            }"
      - name: Every connected model answers, then one final answer
        # الحصص المجانية (مثل 50 طلب/يوم لـ OpenRouter) ممكن تخلص من كثر التجارب — ما نفشّل التشغيل بسببها
        continue-on-error: true
        working-directory: web
        run: |
          node --input-type=module -e "
            import { collectDrafts, ensembleAnswer, ensembleSources, synthesisMessages } from './api/_ensemble.js';
            import { directText } from './api/_direct.js';
            console.log('SOURCES', ensembleSources().join(', '));
            const q = [{ role: 'system', content: 'أنت مساعد ذكي، رد بنفس لهجة المستخدم وباختصار.' }, { role: 'user', content: 'شلون أتعلم البرمجة من الصفر وأنا بالعراق؟ جاوب بثلاث نقاط قصيرة باللهجة العراقية' }];
            const s = Date.now();
            const all = await collectDrafts(q, { timeout: 22000, enough: 99 });
            console.log('ALL_DRAFTS (no early finish)', all.map((d) => d.by).join(', '));
            const s2 = Date.now(); const drafts = await collectDrafts(q, { timeout: 22000 });
            console.log('EARLY_FINISH', drafts.length, 'drafts in', (Date.now() - s2) + 'ms');
            console.log('DRAFTS', drafts.length, 'in', (Date.now() - s) + 'ms');
            for (const d of drafts) console.log('  DRAFT', d.by.padEnd(28), '|', d.text.replace(/\s+/g, ' ').slice(0, 140));
            const t = Date.now();
            const final = await directText(synthesisMessages(q, drafts), { max_tokens: 2048, timeout: 60000 });
            console.log('FINAL', (Date.now() - t) + 'ms', '|', final.replace(/\s+/g, ' ').slice(0, 700));
            if (drafts.length < 2) process.exitCode = 1;"
      - name: Current facts are checked with Google search (the user's real question)
        working-directory: web
        run: |
          node --input-type=module -e "
            import { needsSearch, searchAnswer } from './api/_search.js';
            import { ensembleAnswer } from './api/_ensemble.js';
            for (const q of ['رأيس وزراء لعراق لحالي علي الزيدي', 'منو رئيس وزراء العراق الحالي؟', 'شكد سعر الدولار بالعراق اليوم؟', 'شلونك حبيبي']) console.log('NEEDS_SEARCH', needsSearch(q), '|', q);
            import('./api/_search.js').then(async ({ webContext }) => {
              const c = await webContext('رئيس وزراء العراق', { queries: ['رئيس وزراء العراق', 'Prime Minister of Iraq'] });
              console.log('WEB_CONTEXT', c.count, 'results'); console.log(c.text.slice(0, 1500));
            }).catch((e) => console.log('WEB_FAIL', e.message));
            await new Promise((r) => setTimeout(r, 9000));
            let s = Date.now();
            try { const r = await searchAnswer('منو رئيس وزراء العراق الحالي؟'); console.log('SEARCH', r.model, (Date.now() - s) + 'ms', 'grounded=' + r.searched, '|', r.text.replace(/\s+/g, ' ').slice(0, 400)); console.log('SOURCES', r.sources.map((x) => x.title).join(' ; '), 'QUERIES', JSON.stringify(r.queries || [])); }
            catch (e) { console.log('SEARCH_FAIL', e.message.slice(0, 400)); process.exitCode = 1; }
            s = Date.now();
            const sys = { role: 'system', content: 'أنت مساعد ذكي، رد بنفس لهجة المستخدم وباختصار. الدقة أهم شي.' };
            for (const q of ['رأيس وزراء لعراق لحالي علي الزيدي', 'منو رئيس وزراء العراق هسه؟', 'رئيس وزراء العراق الحالي محمد شياع السوداني صح؟']) {
              s = Date.now();
              try { const r = await ensembleAnswer([sys, { role: 'user', content: q }]); const ok = /الزيدي/.test(r.text) && !/(هو|الحالي)[^.]{0,40}السوداني/.test(r.text);
                    console.log(ok ? 'FACT_OK' : 'FACT_WRONG', (Date.now() - s) + 'ms', r.drafts.map((d) => d.by).join(', '), '|', q, '=>', r.text.replace(/\s+/g, ' ').slice(0, 300)); if (!ok) process.exitCode = 1; }
              catch (e) { console.log('ENSEMBLE_FAIL', e.message.slice(0, 300)); process.exitCode = 1; }
            }"

